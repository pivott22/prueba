plugins { id 'com.android.application' }
android {
    namespace 'cl.pokeofertas.reader'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.pokeofertas.reader'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (System.getenv('READER_SIGNING_FILE')) {
            reader {
                storeFile file(System.getenv('READER_SIGNING_FILE'))
                storeType 'PKCS12'
                storePassword System.getenv('READER_SIGNING_PASSWORD')
                keyAlias 'reader'
                keyPassword System.getenv('READER_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('READER_SIGNING_FILE')) signingConfig signingConfigs.reader
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
